# UzbekPDF alohida compose loyihasi.
#
# QRdasturxon bilan bitta faylga qo'shilmadi: o'sha stekni qayta ishga
# tushirish to'lovchi mijozlar saytiga tegadi, bu esa mustaqil sayt.
#
# Tashqi dunyo bilan bog'lanish faqat Caddy orqali: port `127.0.0.1` ga
# ochiladi, ya'ni internetdan to'g'ridan-to'g'ri kirib bo'lmaydi.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylida ko'rsatilsin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BASE_URL: ${BASE_URL:-https://uzbekpdf.uz}
      DATABASE_URL: sqlite:////app/data/uzbekpdf.db
    volumes:
      # Baza va vaqtinchalik fayllar konteyner yangilanganda yo'qolmasin
      - dbdata:/app/data
      - temp:/app/temp
    # Caddy shu konteynerga umumiy `web` tarmog'i orqali, `uzbekpdf` nomi
    # bilan murojaat qiladi.
    #
    # Ilgari u `host.docker.internal:8100` ga borardi va bu ishlamadi:
    # `127.0.0.1` ga bog'langan port hostning loopback'ida qoladi, konteyner
    # ichidan esa ko'rinmaydi.
    ports:
      - "127.0.0.1:8100:8000"   # faqat serverning o'zidan sinash uchun
    networks:
      default:
      web:
        aliases:
          - uzbekpdf
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  dbdata:
  temp:

networks:
  # QRdasturxon'dagi Caddy ham shu tarmoqqa ulanadi — ikki compose loyihasi
  # bir-birini nomi bilan topishi uchun yagona yo'l. Tarmoq tashqarida
  # yasaladi, ya'ni bu loyihani to'xtatish uni o'chirib yubormaydi:
  #     docker network create web
  web:
    external: true
