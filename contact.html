<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aloqa - UzbekPDF</title>
    <meta name="description" content="UzbekPDF jamoasi bilan bog'lanish. Takliflar, shikoyatlar va texnik yordam uchun bizga murojaat qiling.">
    <meta name="keywords" content="uzbekpdf aloqa, uzbekpdf yordam, texnik yordam, pdf muammo">
    <meta property="og:title" content="Aloqa - UzbekPDF">
    <meta property="og:description" content="Savollaringiz bormi? Biz bilan bog'laning!">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .contact-form-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 4px rgba(229, 50, 45, 0.1);
            border-color: #e5322d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center cursor-pointer" onclick="location.href='/'">
                <div class="w-10 h-10 bg-[#e5322d] text-white rounded-xl flex items-center justify-center">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                </div>

                <span class="ml-3 font-black text-2xl tracking-tighter text-slate-900">UzbekPDF</span>
            </div>
            <a href="/" class="text-sm font-bold text-slate-500 hover:text-slate-900 transition-colors uppercase tracking-widest flex items-center">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Asosiyga qaytish
            </a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-20 px-4 relative overflow-hidden">
        <!-- Abstract Background -->
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-red-50 rounded-full blur-3xl opacity-40 -translate-y-1/2 translate-x-1/2"></div>
        <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-blue-50 rounded-full blur-3xl opacity-40 translate-y-1/2 -translate-x-1/2"></div>

        <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10">
            <div>
                <h1 class="text-6xl font-black text-slate-900 mb-6 tracking-tighter leading-tight">Savollaringiz bormi? <br/><span class="text-[#e5322d]">Bog'laning!</span></h1>
                <p class="text-xl text-slate-500 font-medium mb-12 max-w-md leading-relaxed">
                    Biz har doim yordamga tayyormiz. Savol, taklif yoki hamkorlik bo'yicha bizga yozishingiz mumkin.
                </p>

                <div class="space-y-8">
                    <div class="flex items-center space-x-6">
                        <div class="w-14 h-14 bg-white rounded-2xl shadow-lg border border-slate-100 flex items-center justify-center text-red-500">
                            <i data-lucide="mail" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Elektron pochta</div>
                            <div class="text-lg font-bold text-slate-800">support@uzbekpdf.uz</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-6">
                        <div class="w-14 h-14 bg-white rounded-2xl shadow-lg border border-slate-100 flex items-center justify-center text-blue-500">
                            <i data-lucide="send" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Telegram</div>
                            <div class="text-lg font-bold text-slate-800">@uzbekpdf_bot</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="contact-form-panel bg-white p-10 md:p-16 rounded-[40px] shadow-2xl shadow-slate-200 border border-slate-100">
                <form onsubmit="event.preventDefault(); alert('Xabaringiz yuborildi! Tez orada bog\'lanamiz.'); this.reset();" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Ismingiz</label>
                            <input type="text" required placeholder="Ali" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold text-slate-800 input-glow transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Email</label>
                            <input type="email" required placeholder="ali@gmail.com" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold text-slate-800 input-glow transition-all">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Mavzu</label>
                        <input type="text" required placeholder="Savol" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold text-slate-800 input-glow transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Xabar</label>
                        <textarea rows="4" required placeholder="Qanday yordam bera olamiz?" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold text-slate-800 input-glow transition-all resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full py-5 bg-[#e5322d] text-white font-black rounded-2xl shadow-xl shadow-red-100 hover:scale-[1.02] active:scale-[0.98] transition-all text-sm uppercase tracking-widest">Xabarni yuborish</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white py-12 border-t border-slate-100 mt-auto">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">&copy; 2026 UzbekPDF. Biz sizni tinglaymiz.</p>
        </div>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
