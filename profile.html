<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Profilim - UzbekPDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #fdfdfe; color: #1e293b; }
        .nav-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .profile-card {
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.04);
            border: 1px solid #f1f5f9;
        }
        .stat-card {
            background: #f8fafc;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            background: white;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05);
            border-color: #e2e8f0;
        }
        .premium-badge {
            background: linear-gradient(135deg, #e5322d 0%, #c22b27 100%);
            box-shadow: 0 4px 12px rgba(229, 50, 45, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="nav-glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center cursor-pointer" onclick="location.href='/'">
                <div class="w-10 h-10 bg-[#e5322d] text-white rounded-xl flex items-center justify-center">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                </div>
                <span class="ml-3 font-black text-2xl tracking-tighter text-slate-900">UzbekPDF</span>
            </div>
            <div class="flex items-center space-x-6">
                <a href="/" class="text-sm font-bold text-slate-500 hover:text-slate-900 transition-colors uppercase tracking-widest">Asosiy</a>
                <button onclick="logout()" class="text-sm font-bold text-red-500 hover:text-red-600 transition-colors uppercase tracking-widest">Chiqish</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl w-full mx-auto px-6 py-12">
        <div class="profile-card p-10 md:p-16">
            <!-- Profile Header -->
            <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-10 mb-16">
                <div class="relative">
                    <div class="w-32 h-32 bg-slate-100 rounded-[2rem] flex items-center justify-center text-slate-400 border-4 border-white shadow-xl overflow-hidden">
                        <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=f1f5f9&color=64748b&size=200" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <div id="premium-indicator" class="hidden absolute -bottom-2 -right-2 premium-badge text-white p-2 rounded-xl shadow-lg">
                        <i data-lucide="crown" class="w-5 h-5"></i>
                    </div>
                </div>
                
                <div class="text-center md:text-left flex-grow">
                    <div class="flex flex-col md:flex-row md:items-center space-y-2 md:space-y-0 md:space-x-4 mb-2">
                        <h1 id="display-name" class="text-4xl font-black tracking-tight text-slate-900">Foydalanuvchi</h1>
                        <span id="plan-badge" class="inline-block px-3 py-1 bg-slate-100 text-slate-500 text-[10px] font-black uppercase tracking-widest rounded-lg">Bepul Reja</span>
                    </div>
                    <p id="user-email" class="text-slate-400 font-medium mb-6">@username</p>
                    <div class="flex flex-wrap justify-center md:justify-start gap-4">
                        <button onclick="location.href='/premium'" class="px-6 py-3 bg-[#e5322d] text-white font-bold rounded-2xl hover:bg-[#c22b27] transition-all shadow-lg shadow-red-100">Premiumga o'tish</button>
                        <button class="px-6 py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 transition-all border border-slate-200/50">Profilni tahrirlash</button>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
                <div class="stat-card p-8">
                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center mb-6">
                        <i data-lucide="file-check" class="w-6 h-6"></i>
                    </div>
                    <div class="text-3xl font-black text-slate-900" id="usage-count">0/3</div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-1">Bugungi fayllar</p>
                </div>
                <div class="stat-card p-8">
                    <div class="w-12 h-12 bg-purple-50 text-purple-500 rounded-2xl flex items-center justify-center mb-6">
                        <i data-lucide="zap" class="w-6 h-6"></i>
                    </div>
                    <div class="text-3xl font-black text-slate-900" id="status-text">Faol</div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-1">Hisob holati</p>
                </div>
                <div class="stat-card p-8">
                    <div class="w-12 h-12 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center mb-6">
                        <i data-lucide="calendar" class="w-6 h-6"></i>
                    </div>
                    <div class="text-3xl font-black text-slate-900" id="join-date">---</div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-1">Ro'yxatdan o'tgan</p>
                </div>
            </div>

            <!-- Recent Activity / Transactions Placeholder -->
            <div class="border-t border-slate-100 pt-12">
                <h3 class="text-xl font-black text-slate-900 tracking-tight mb-8">So'nggi to'lovlar</h3>
                <div id="transactions-list" class="space-y-4">
                    <div class="flex items-center justify-center py-12 bg-slate-50/50 rounded-[2rem] border-2 border-dashed border-slate-200">
                        <div class="text-center">
                            <i data-lucide="credit-card" class="w-10 h-10 text-slate-300 mx-auto mb-4"></i>
                            <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Hozircha to'lovlar mavjud emas</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-10 text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.3em]">
        &copy; 2024 UzbekPDF &bull; Premium Experience
    </footer>

    <script>
        lucide.createIcons();

        // Load User Data
        async function loadProfile() {
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/login';
                return;
            }

            try {
                // Fetch user info from backend
                const response = await fetch('/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                
                // Update UI
                document.getElementById('display-name').textContent = data.username;
                document.getElementById('user-email').textContent = `@${data.username}`;
                document.getElementById('profile-avatar').src = data.avatar_url || `https://ui-avatars.com/api/?name=${data.username}&background=e5322d&color=fff&size=200`;
                
                if (data.is_premium) {
                    document.getElementById('premium-indicator').classList.remove('hidden');
                    document.getElementById('plan-badge').textContent = 'Premium Reja';
                    document.getElementById('plan-badge').className = 'inline-block px-3 py-1 bg-red-50 text-red-600 text-[10px] font-black uppercase tracking-widest rounded-lg';
                    document.getElementById('status-text').textContent = 'Premium';
                    document.getElementById('usage-count').textContent = 'Cheksiz';
                }

                // Load usage from another endpoint or from the same data if added
                if (data.usage_count !== undefined) {
                   document.getElementById('usage-count').textContent = data.is_premium ? 'Cheksiz' : `${data.usage_count}/3`;
                }

            } catch (err) {
                console.error("Profile load error:", err);
            }
        }

        function logout() {
            localStorage.clear();
            location.href = '/';
        }

        loadProfile();
    </script>
</body>
</html>
