<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - UzbekPDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; color: #1e293b; }
        .sidebar {
            background: #1e293b;
            color: white;
            width: 280px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s;
        }
        .main-content {
            margin-left: 280px;
            padding: 40px;
            min-height: 100vh;
        }
        .admin-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-premium { background: #fef2f2; color: #ef4444; }
        .status-free { background: #f0fdf4; color: #22c55e; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-6 flex flex-col">
        <div class="flex items-center mb-10 px-2">
            <div class="w-8 h-8 bg-red-500 rounded-lg flex items-center justify-center mr-3">
                <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-black text-xl tracking-tighter">AdminPanel</span>
        </div>
        
        <nav class="flex-grow space-y-2">
            <a href="#" onclick="showSection('dashboard')" class="flex items-center space-x-3 px-4 py-3 bg-white/10 rounded-xl font-bold transition-all hover:bg-white/20">
                <i data-lucide="layout-dashboard" class="w-5 h-5 text-slate-400"></i>
                <span>Boshqaruv</span>
            </a>
            <a href="#" onclick="showSection('users')" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-bold transition-all hover:bg-white/10 text-slate-400 hover:text-white">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span>Foydalanuvchilar</span>
            </a>
            <a href="#" onclick="showSection('payments')" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-bold transition-all hover:bg-white/10 text-slate-400 hover:text-white">
                <i data-lucide="credit-card" class="w-5 h-5"></i>
                <span>To'lovlar</span>
            </a>
        </nav>

        <div class="mt-auto border-t border-white/10 pt-6">
            <button onclick="location.href='/'" class="flex items-center space-x-3 px-4 py-3 text-slate-400 hover:text-white transition-all w-full">
                <i data-lucide="external-link" class="w-5 h-5"></i>
                <span>Saytga qaytish</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Dashboard Section -->
        <div id="section-dashboard" class="space-y-8 animate-fadeIn">
            <header class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Xush kelibsiz!</h1>
                    <p class="text-slate-500 font-medium">UzbekPDF platformasining umumiy holati</p>
                </div>
                <div class="flex space-x-3">
                    <button onclick="refreshData()" class="p-3 bg-white rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="admin-card p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center">
                            <i data-lucide="users" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <div class="text-2xl font-black text-slate-900" id="stat-total-users">0</div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Jami a'zolar</p>
                </div>
                <div class="admin-card p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 bg-red-50 text-red-500 rounded-xl flex items-center justify-center">
                            <i data-lucide="crown" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <div class="text-2xl font-black text-slate-900" id="stat-premium-users">0</div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Premium a'zolar</p>
                </div>
                <div class="admin-card p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 bg-green-50 text-green-600 rounded-xl flex items-center justify-center">
                            <i data-lucide="banknote" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <div class="text-2xl font-black text-slate-900" id="stat-total-earnings">0</div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Jami daromad (so'm)</p>
                </div>
                <div class="admin-card p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center">
                            <i data-lucide="file-text" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <div class="text-2xl font-black text-slate-900" id="stat-total-files">0</div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Bugungi fayllar</p>
                </div>
            </div>

            <!-- Users Table -->
            <div class="admin-card overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-black text-slate-900 uppercase tracking-widest text-xs">Foydalanuvchilar ro'yxati</h3>
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" placeholder="Qidirish..." class="pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-red-500 transition-all">
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-50/50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <th class="px-6 py-4">ID</th>
                                <th class="px-6 py-4">Foydalanuvchi</th>
                                <th class="px-6 py-4">Email</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="text-sm divide-y divide-slate-50">
                            <!-- Rows will be added here via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function showSection(name) {
            // Placeholder for section switching
        }

        async function fetchAdminData() {
            const token = localStorage.getItem('token');
            if (!token) { location.href = '/login'; return; }

            try {
                // Fetch stats
                const statsRes = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const stats = await statsRes.json();
                
                document.getElementById('stat-total-users').textContent = stats.total_users;
                document.getElementById('stat-premium-users').textContent = stats.premium_users;
                document.getElementById('stat-total-earnings').textContent = stats.total_earnings.toLocaleString();
                document.getElementById('stat-total-files').textContent = stats.today_files;

                // Fetch users
                const usersRes = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await usersRes.json();
                
                const tableBody = document.getElementById('users-table-body');
                tableBody.innerHTML = '';
                
                users.forEach(user => {
                    const row = `
                        <tr class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs text-slate-400">#${user.id}</td>
                            <td class="px-6 py-4 font-bold text-slate-900">${user.username}</td>
                            <td class="px-6 py-4 text-slate-500">${user.email || '—'}</td>
                            <td class="px-6 py-4">
                                <span class="status-badge ${user.is_premium ? 'status-premium' : 'status-free'}">
                                    ${user.is_premium ? 'Premium' : 'Free'}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="togglePremium(${user.id}, ${!user.is_premium})" class="p-2 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-red-500 transition-all">
                                    <i data-lucide="${user.is_premium ? 'user-minus' : 'user-plus'}" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
                lucide.createIcons();
            } catch (err) {
                console.error("Admin fetch error:", err);
            }
        }

        async function togglePremium(userId, status) {
            if (!confirm(`Haqiqatdan ham foydalanuvchi statusini o'zgartirmoqchimisiz?`)) return;
            
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/admin/users/${userId}/premium`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ is_premium: status })
                });
                if (res.ok) {
                    fetchAdminData();
                }
            } catch (err) {
                alert("Xatolik yuz berdi");
            }
        }

        fetchAdminData();
    </script>
</body>
</html>
